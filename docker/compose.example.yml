name: network-mapping-scanner
services:
  scanner:
    image: ${SCANNER_IMAGE:?Set SCANNER_IMAGE to an approved version or digest}
    env_file: ./.env
    init: true
    restart: unless-stopped
    network_mode: host
    # Root with only NET_RAW retained: raw-socket permissions must survive exec
    # into masscan. Do not substitute a non-root user without validating that.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    read_only: true
    stop_signal: SIGINT
    stop_grace_period: 90s
    volumes:
      - scanner-data:/var/lib/network-mapping-scanner
      - scanner-logs:/var/log/network-mapping-scanner
      # Optional private CA bundle; keep NM__SCANNER__VERIFY_TLS=true.
      # - ./runtime/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      # Official templates ship in the image. Their writable copy and optional
      # startup updates live in scanner-data; set NM__NUCLEI__UPDATE_TEMPLATES.
    # Nuclei may use a writable per-user cache even with updates disabled.
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m", "/root/.cache:rw,noexec,nosuid,size=128m"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  scanner-data:
  scanner-logs:
