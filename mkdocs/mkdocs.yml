site_name: Network Mapping Scanner 文档
site_description: 网络测绘系统扫描器技术文档
site_url: https://blog.abdc.world

docs_dir: ../docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit    # 加上这个
    - content.action.view    # 可选，查看源文件

validation:
  nav:
    omitted_files: warn
  links:
    absolute_links: relative_to_docs
    not_found: warn
    anchors: warn
    unrecognized_links: warn

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 文档首页: README.md
  - 更新日志: CHANGELOG.md
  - 入门部署:
      - 部署选型与原生安装: DEPLOYMENT.md
      - Docker 部署: DOCKER.md
      - 启动配置检查: CONFIG_CHECK.md
  - 配置与引擎:
      - 配置与使用: USAGE.md
      - masscan 适配与迁移: MASSCAN.md
      - Nuclei 部署与运维: NUCLEI.md
      - 目标执行反馈: PERFORMANCE.md
  - 运维排障:
      - 扫描与上传恢复: recovery.md
      - 扫描缓存管理: CACHE_MANAGEMENT.md
      - 远程诊断与日志: DIAGNOSTICS.md
      - 模块执行与热更新: MODULE_UPDATES.md
  - 开发参考:
      - 扫描器维护参考: MAINTENANCE.md
      - 模块化与热更新设计: MODULAR_HOT_UPDATE_DESIGN.md
      - 文档维护与本地预览: DOCUMENTATION.md

hooks:
  - hooks.py

repo_url: https://github.com/wshijiang/Network-Mapping-Scanner
repo_name: wshijiang/Network-Mapping-Scanner
edit_uri: edit/mkdocs/docs/

markdown_extensions:
#开启 mermaid插件
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  #保留中文，避免文档内部的锚链接失效
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  # 页脚右侧图标
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wshijiang/Network-Mapping-Scanner
      name: GitHub 源代码

    - icon: fontawesome/solid/globe
      link: https://blog.abdc.world
      name: 博客


# 版权信息
copyright: >
  Copyright &copy; 2026 Network Mapping Project.
  All rights reserved.
  <br>
