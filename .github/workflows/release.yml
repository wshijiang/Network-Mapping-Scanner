name: Build release

on:
  push:
    # Main builds only warm the Cargo cache; packaging and publishing require a release run.
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - .github/workflows/release.yml
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    container:
      image: rust:1.98.0-bookworm
    env:
      BUILD_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            cmake \
            libssl-dev \
            musl-tools \
            pkg-config
          rm -rf /var/lib/apt/lists/*

      - name: Verify Debian 12 build environment
        run: |
          source /etc/os-release
          test "$ID" = 'debian'
          test "$VERSION_ID" = '12'
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.36'
          rustc --version
          cargo --version

      - name: Install Rust target
        run: rustup target add "$BUILD_TARGET"

      - name: Configure Cargo build
        run: |
          set -euo pipefail
          if [[ "$BUILD_TARGET" == *-musl ]]; then
            echo 'CC=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            # Debian's musl-gcc wrapper does not support Rust's default static PIE.
            # Use a static executable so the wrapper cannot add an interpreter.
            echo 'RUSTFLAGS=-C target-feature=+crt-static -C relocation-model=static' >> "$GITHUB_ENV"
          fi

      - name: Restore Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: scanner-release-${{ matrix.target }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build scanner
        run: |
          set -euo pipefail
          cargo build --locked --release --bins --target "$BUILD_TARGET"

      - name: Verify Debian 12 GLIBC compatibility
        if: endsWith(matrix.target, '-gnu')
        run: |
          set -euo pipefail

          for scanner_binary in scanner-rs scanner-worker scanner-package; do
            binary_path="target/$BUILD_TARGET/release/$scanner_binary"

            required_glibc="$({
              objdump -T "$binary_path" \
                | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p'
            } | sort -V | tail -n 1)"

            if [[ -z "$required_glibc" ]]; then
              echo "Unable to determine GLIBC requirement: $scanner_binary" >&2
              exit 1
            fi

            if dpkg --compare-versions "$required_glibc" gt '2.36'; then
              echo "$scanner_binary requires GLIBC_$required_glibc, newer than Debian 12 GLIBC_2.36" >&2
              exit 1
            fi

            echo "$scanner_binary maximum GLIBC requirement: GLIBC_$required_glibc"
          done
          
      - name: Verify Debian 12 GLIBC compatibility
        if: endsWith(matrix.target, '-gnu')
        run: |
          set -euo pipefail
          required_glibc="$({
            objdump -T "target/$BUILD_TARGET/release/scanner-rs" \
              | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p'
          } | sort -V | tail -n 1)"
          if [[ -z "$required_glibc" ]]; then
            echo 'Unable to determine the scanner GLIBC requirement' >&2
            exit 1
          fi
          if dpkg --compare-versions "$required_glibc" gt '2.36'; then
            echo "Scanner requires GLIBC_$required_glibc, newer than Debian 12 GLIBC_2.36" >&2
            exit 1
          fi
          echo "Scanner maximum GLIBC requirement: GLIBC_$required_glibc"

      - name: Verify static musl binary
        if: endsWith(matrix.target, '-musl')
        run: |
          set -euo pipefail
          binary="target/$BUILD_TARGET/release/scanner-rs"
          readelf -l "$binary" > "$RUNNER_TEMP/musl-program-headers.txt"
          readelf -d "$binary" > "$RUNNER_TEMP/musl-dynamic-section.txt"
          if grep -q 'INTERP' "$RUNNER_TEMP/musl-program-headers.txt"; then
            echo 'musl binary contains a dynamic interpreter' >&2
            exit 1
          fi
          if grep -q '(NEEDED)' "$RUNNER_TEMP/musl-dynamic-section.txt"; then
            echo 'musl binary depends on shared libraries' >&2
            exit 1
          fi
          "$binary" --version

      - name: Resolve package metadata
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        id: package
        run: |
          set -euo pipefail
          package_id="$(cargo pkgid)"
          version="${package_id##*@}"
          if [[ -z "$version" || "$version" == "$package_id" ]]; then
            echo 'Unable to read scanner version from Cargo.toml' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi
          archive="network-mapping-scanner-v${version}-${BUILD_TARGET}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Assemble release archive
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        env:
          ARCHIVE_NAME: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          test -x "target/$BUILD_TARGET/release/scanner-rs"

          stage_parent="$RUNNER_TEMP/network-mapping-scanner-release"
          package_root="$stage_parent/$ARCHIVE_NAME"

          mkdir -p "$package_root" release
          install -m 0755 "target/$BUILD_TARGET/release/scanner-rs" "$package_root/scanner-rs"
          install -m 0755 "target/$BUILD_TARGET/release/scanner-worker" "$package_root/scanner-worker"
          install -m 0755 "target/$BUILD_TARGET/release/scanner-package" "$package_root/scanner-package"
          install -m 0644 config.toml "$package_root/config.example.toml"
          sed -E -i \
            -e 's/^([[:space:]]*(scanner_id|runtime_token)[[:space:]]*=).*/\1 ""/' \
            -e 's/^([[:space:]]*c_server[[:space:]]*=).*/\1 "127.0.0.1"/' \
            "$package_root/config.example.toml"
          cp -a README.md LICENSE docs "$package_root/"

          cat > "$package_root/BUILD-INFO" <<EOF
          scanner-version=${{ steps.package.outputs.version }}
          scanner-commit=$GITHUB_SHA
          target=$BUILD_TARGET
          rustc=$(rustc --version)
          EOF

          tar -C "$stage_parent" -czf "release/$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"
          (
            cd release
            sha256sum "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256"
          )

          archive_contents="$RUNNER_TEMP/scanner-archive-contents.txt"
          tar -tzf "release/$ARCHIVE_NAME.tar.gz" > "$archive_contents"
          if grep -E '/(src|target|\.git|logs)(/|$)' "$archive_contents"; then
            echo 'Archive contains an excluded path' >&2
            exit 1
          fi

      - name: Upload build artifact
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish all Linux release archives
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: network-mapping-scanner-v*
          path: release
          merge-multiple: true

      - name: Verify archive checksums
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find release -maxdepth 1 -name '*.tar.gz.sha256' | wc -l)" -eq 4
          cd release
          sha256sum --check *.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
