name: Validate scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.99.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --bins
      - name: Verify env registration and restart recovery against local HTTPS fixture
        run: python3 tests/registration_env.py target/release/scanner-rs
