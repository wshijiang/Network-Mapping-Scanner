name: Validate scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build pinned zgrab2 and verify real engine compatibility
        shell: bash
        run: |
          set -euo pipefail
          revision=$(sed -n '/git init zgrab2/,/go build/ s/.*fetch --depth=1 origin \([0-9a-f]\{40\}\).*/\1/p' Dockerfile)
          test "${#revision}" = 40
          engine_dir="$RUNNER_TEMP/zgrab2-source"
          git init "$engine_dir"
          git -C "$engine_dir" remote add origin https://github.com/zmap/zgrab2.git
          git -C "$engine_dir" fetch --depth=1 origin "$revision"
          git -C "$engine_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$engine_dir" rev-parse HEAD)" = "$revision"
          (cd "$engine_dir" && go build -mod=readonly -trimpath -o "$RUNNER_TEMP/zgrab2" ./cmd/zgrab2)
          ZGRAB2_TEST_BINARY="$RUNNER_TEMP/zgrab2" cargo test --locked --lib real_zgrab -- --ignored
      - run: cargo build --locked --release --bins
      - name: Verify env registration and restart recovery against local HTTPS fixture
        run: python3 tests/registration_env.py target/release/scanner-rs
