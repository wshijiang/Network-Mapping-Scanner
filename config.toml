[scanner]
# Target API server hostname
c_server = "example.com"
# Target API server port
c_port = 443
# Masscan packet rate
rate = 10000000
# Verify TLS certificates (set to false for self-signed certs)
verify_tls = true
# Path to masscan binary (port discovery only)
scanner_path = "./a"
# Legacy identity migration field; runtime identity is stored in scanner-state.sqlite3
scanner_id = ""
# Legacy runtime-token migration field; new registrations do not write this file
runtime_token = ""
# HTTP and automatic reconnect settings
connect_timeout_seconds = 5
request_timeout_seconds = 15
reconnect_initial_delay_seconds = 1
reconnect_max_delay_seconds = 60
active_task_reconnect_max_delay_seconds = 10
# Stop local work before an unconfirmed server lease can expire
lease_safety_margin_seconds = 10

[service_detection]
# Run zgrab2 after masscan to identify selected TCP services.
enabled = true
# If false, a zgrab2 process failure still uploads the discovered open ports.
required = false
# standard keeps one port-mapped probe; adaptive adds bounded fallback probes;
# exhaustive tries every supported safe protocol module on each TCP endpoint.
strategy = "adaptive"
max_probes_per_endpoint = 8
# Only candidates at or above this confidence are reported as identified services.
confidence_threshold = 80
zgrab_path = "zgrab2"
# Connection workers and per-target-IP connection rate.
senders = 200
server_rate_limit = 20
connect_timeout_seconds = 5
target_timeout_seconds = 15
# Maximum structured zgrab2 detail retained per service result.
max_result_bytes = 65536

[dns]
# 默认使用系统递归解析器，任务也可指定 UDP/TCP DNS 服务器。设为 false 可禁用 DNS 任务。
enabled = true
record_types = ["A", "AAAA", "CNAME", "NS", "MX", "PTR", "SRV", "TXT", "CAA", "SOA", "SVCB", "HTTPS"]
query_timeout_seconds = 5

[nuclei]
# 漏洞扫描默认关闭；Docker 已内置工具和官方模板。
enabled = false
path = "nuclei"
templates_path = "/opt/nuclei-templates/safe"
# 文件部署可留空；Docker 示例提供镜像内置模板目录作为初始来源。
bundled_templates_path = ""
# 仅在启用 Nuclei 的正常启动时更新一次，注册和健康检查不执行更新。
update_templates = false
template_update_timeout_seconds = 300
severities = ["medium", "high", "critical"]
rate_limit = 20
bulk_size = 5
concurrency = 5
timeout_seconds = 10
retries = 1
max_runtime_seconds = 1800
max_findings = 10000
# 单条 JSONL 结果的最大字节数；原始请求/响应不会进入上传数据。
max_result_bytes = 262144

[network]
# 自动探测协议公网出口；可关闭某个地址族或替换为自建的 IP 回显 API。
ipv4_enabled = true
ipv6_enabled = true
ipv4_probe_url = "https://api.ipify.org?format=json"
ipv6_probe_url = "https://api6.ipify.org?format=json"
probe_interval_seconds = 300
probe_timeout_seconds = 5

[upload]
# Endpoint for scan result upload (HTTPS POST JSON)
endpoint = "https://example.com/api/scanner/result"

[modules]
# Opt in after building/installing scanner-worker and draining old checkpoints.
enabled = false
directory = "./scanner-modules"
state_database = "./scanner-modules.sqlite3"
worker_path = "./scanner-worker"
trusted_keys = "./trusted-update-keys.json"
cancel_grace_seconds = 5
stage_timeout_seconds = 86400
auto_rollback = true
# Optional HTTPS release feed. No scanner credentials are sent to this URL.
# desired_url = "https://updates.example.com/scanner/desired.json"
